<!DOCTYPE html>
<html lang="en">
    <head>

        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/dce6efa4ea.js" crossorigin="anonymous"></script>

        <link rel="stylesheet" href="/css/Navbar.css" type="text/css">
        <link rel="stylesheet" href="/css/ShipmentsLogisticsManager.css" type="text/css">
        <link rel="stylesheet" href="/css/MobileNavigationBar.css" type="text/css">    
        <link rel="stylesheet" href="/css/ManageLogistics.css" type="text/css">  
        
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <script type="module" src="/js/Logout.js"></script>
        <!-- <script type="text/javascript" src="/js/MobileNavigationBar.js"></script> -->
        <script type="module" src="/js/ShipmentsLogisticsManager.js"></script>
        
        <title>HighFlyersUkCouriers</title>
    </head>
    <body>
  
      <header>
        <div id="mobilenavmenu"  class="hideMobileMenu">
          <div id="mobilenavwrapper">
            <div id="closemobilenavmenu"><p id="closenavtext">close</p><p>X</p></div>
              <a class="logoutButton">Logout</a>
              <a class="currentpage" href="/manage-orders">Bookings</a>
              <a href="/content-manager">Content Manager</a>
              <a href="/manage-accounts">Accounts</a>
              <a class="navLinks" href="/manage-logistics">Logistics</a>
          </div>
        </div>
        <nav id="menu">
          <div id="mobilenavtoggle">
            <div></div>
            <div></div>
            <div></div>
          </div>
          <a class="navLinks logoutButton">Logout</a>
          <a class="navLinks" href="/manage-orders">Bookings</a>
          <a class="navLinks" href="/content-manager">Content Manager</a>
          <a class="navLinks" href="/manage-accounts">Accounts</a>
          <a class="navLinks" href="/manage-logistics">Logistics</a>
        </nav>
    
      </header>
      <Section id="navbarMainContentWrapper">

        <div id="create_shipment_widget" class="createShipmentWidget hidden">

          <h1>Create New Shipment</h1>

          <div class="createShipmentContentWrapper">

            <div class="flex-col">
              <label for="shipment_name">Shipment Name</label>
              <input class="shipmentWidgetInput" type="text" name="shipment_name" id="shipment_name">
            </div>

            <div class="flex-col">
              <label for="shipment_delivery_week">Week</label>
              <input class="shipmentWidgetInput" type="number" name="shipment_delivery_week" id="shipment_delivery_week">
            </div>
            
            <div class="flex-col">
              <label for="shipment_run_type">Run Type</label>
              <select type="text" name="shipment_run_type" id="shipment_run_type">
                <option value="collection">Collection</option>
                <option value="delivery">Delivery</option>
              </select>
            </div>

          </div>

          <div>

            <button id="cancel_create_shipment" class="shipmentWidgetButton">Cancel</button>
            <button id="save_create_shipment" class="shipmentWidgetButton">Save</button>
          
          </div>
        </div>

        <nav class="logisticsVerticalNavbar">
          <a class="verticalNavbarLink" href="/live-logistics-manager">
              <span id="liveLogisticsManagerButton" class="material-symbols-outlined navbarIcon">
              share_location
              </span>
          </a>
          <span id="shipmentLogisticsManagerButton" class="material-symbols-outlined navbarIcon selectedIconColour">
            package_2
          </span>
          <a class="verticalNavbarLink" href="/logistics-settings">
            <span id="liveLogisticsManagerButton" class="material-symbols-outlined navbarIcon">
            settings
            </span>
          </a>
        </nav>
        <Section class="mainContent">

          <Section class="shipmentsLogisticsManagerWrapper">
            <Section class="shipmentsWindow">
              <h1 class="windowTitle">Shipments</h1>
              <div class="selectWrapper" >
                <label for="shipmentGroups" hidden="hidden">Shipment</label>
                <select id="shipmentGroups" class="selectShipment" name="shipmentGroups">
                  <option selected value="">-- select a shipment --</option>  
                  <option value="Wednesday Collections">Collections Week 14</option>  
                  <option value="Thursday Deliverys">Deliverys Week 14</option>
                  <option value="CREATE_SHIPMENT">Create Shipment</option>
                </select>
                <span class="material-symbols-rounded dropDownIcon">
                  arrow_drop_down_circle
                </span>
              </div>
              <div id="unassignedOrdersCard" class="unassignedOrdersCard">
                <span class="warningIcon material-symbols-outlined ">
                  report
                </span>
                <p class="unassignedOrdersTitle">Unassigned</p>
                <p class="numberOfUnassignedOrders">#19</p>
              </div>
              <div id="runCardList" class="runCardList">
              
              </div>                 
            </Section>
            
          </Section>
          <Section id="dependantContent" class="dependantContent">
              
            <div id="unassignOrdersView">
              
              <div id="filterWrapper"></div>
              <table id="unassignedOrdersTable">

              </table>
                
            </div>

            <div id="selectedRunView">
              <!-- <gmp-map center="53.1629, -2.2189" zoom="13" map-id="DEMO_MAP_ID"></gmp-map> -->
        
            </div>
          </Section>
        </Section>
      </Section>
    </body>
    <!-- <script src={{"https://maps.googleapis.com/maps/api/js?key=#{ places_api_key }&libraries=maps,marker&v=beta"}} defer></script> -->
    
</html>
