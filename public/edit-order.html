<!DOCTYPE html>
<html lang="en">
  <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/dce6efa4ea.js"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/Navbar.css" type="text/css">
    <link rel="stylesheet" href="/css/EditOrders.css" type="text/css">
    <link rel="stylesheet" href="/css/MobileNavigationBar.css" type="text/css">
    <title>HighFlyersUKCouriers</title>
  </head>
  <body>
    <div id="wrapper">
      <header>
        <nav id="menu">
          <a class="navLinks" href="/manage-orders">Back</a>
        </nav>
      </header>
      <div id="maincontent">

        <form action="/edit-order" method="post">
          <div class="form">
    
            <table id="orderdata">

              <tr>
                <td>
                  <label for="id">ID: </label>
                </td>
              </tr>
            
              <tr>
                <td>
                  <label for="animalType">Bird/Animal type: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="quantity">Quantity: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="email">Email Address: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="username">Account: </label>
                </td>
              </tr>

              <tr>
                <td>                 
                    <label for="deliveryWeek">Delivery Week: </label>  
                </td>
              </tr>

              <tr>
                <td>
                  <label for="collectionName">Collection Name: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="collectionAddress1">Collection Address 1: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="collectionAddress2">Collection Address 2: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="collectionAddress3">Collection Address 3: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="collectionPostcode">Collection Postcode: </label>
                </td>
              </tr>

               <tr>
                <td>
                  <label for="collectionPhoneNumber">Collection Telephone number: </label>
                </td>
              </tr>


              <tr>
                <td>
                  <label for="deliveryName">Delivery Name: </label>
                </td>          
              </tr>
            
              <tr>
                <td>
                  <label for="deliveryAddress1">Delivery Address Line 1: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="deliveryAddress2">Delivery Address Line 2: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="deliveryAddress3">Delivery Address Line 3: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="deliveryPostcode">Delivery Postcode: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="deliveryPhoneNumber">Delivery Telephone Number: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="payment">Payment on Delivery or Collection?: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="message">Message: </label>
                </td>
              </tr>

              <tr>
                <td>
                  <label for="code">Code: </label>
                </td>
              </tr>
              <tr>
                <td>
                  <label for="addedby">Added By: </label>
                </td>
              </tr>
              <tr>
                <td>
                  <label for="printed">Printed: </label>
                </td>
              </tr>
              <tr>
                <td>
                  <label for="timestamp">Timestamp: </label>
                </td>
              </tr>
            </table>
          </div>
          <div id="savebuttonwrapper">
            <input type="submit" value="Save">
          </div>
        </form>

      </div>
    </div>

  </body>
  <script type="module" src="/js/EditOrder.js"></script>
</html>
