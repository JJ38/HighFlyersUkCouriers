
<!DOCTYPE html>
<html lang="en">
  <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/dce6efa4ea.js"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/Navbar.css" type="text/css">
    <link rel="stylesheet" href="/css/DeleteOrder.css" type="text/css">
    <link rel="stylesheet" href="/css/MobileNavigationBar.css" type="text/css">
    <title>{{ page_title }}</title>
  </head>
  <body>

    <div id="wrapper">
      <header>
        <nav id="menu">
          <a class="navLinks" href="/manage-orders">Back</a>
        </nav>
      </header>
      <div id="maincontent">
        <div class="form">
          <table>
            {{orderdata|raw}}
          </table>
        </div>
        <form action="/delete-order" method="post">
          <div class="formItem">
            Are you sure you want to delete this order?
          </div>
          <div class="formItem">
            <input type="submit" value="Yes">
          </div>
        </form>
      </div>
    </div>
  </body>
  <script type="text/javascript" src="{{ js_file }}"></script>
  <script type="text/javascript" src="/js/MobileNavigationBar.js"></script>
</html>
