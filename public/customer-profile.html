<!DOCTYPE html>
<html>
    <head> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/NavBar.css" type="text/css">
        <link rel="stylesheet" href="/css/MobileNavigationBar.css" type="text/css">
        <link rel="stylesheet" href="/css/CustomerProfile.css" type="text/css">
        <link rel="stylesheet" href="/css/Notification.css" type="text/css">
        <script type="module" src="/js/MobileNavigationBar.js"></script>
        <script type="module" src="/js/CustomerProfile.js"></script>
        <script type="module" src="/js/Notification.js"></script>
        <script type="module" src="/js/Firebase.js"></script>
        <title>HighFlyersUkCouriers</title>
        
    </head>
    <body>
        <header>
            <div id="mobilenavmenu"  class="hideMobileMenu">
                <div id="mobilenavwrapper">
                <div id="closemobilenavmenu"><p id="closenavtext">close</p><p>X</p></div>
                    <a href="/logout">Logout</a>
                    <a href="/customer-order">Order</a>
                    <a class="currentpage" href="/customer-profile">Profile</a>            
                </div>
            </div>
            <nav class="menu" contenteditable="false">
                <div id="mobilenavtoggle">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <a class="navLinks" href="/logout">Logout</a>
                <div>
                    <a class="navLinks" href="/customer-order">Order</a>
                    <div class="underlineOrder"></div>
                </div>
                <div>
                    <a class="navLinks" href="/customer-profile">Profile</a>
                    <div class="underlineProfile"></div>
                </div>
            </nav>
        </header>
        <div class="profileinfobubble">
            <div id="loader" class="loader"></div>
            <div id="customerProfileData" class="hidden">
                <h2>Contact info</h2>
                    <hr>
                    <section class="formsection">
                        <section class="bookingInput">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" required="">
                        </section>
                    </section>    
                <h2>
                    Collection info
                </h2>
                <hr>
                <section class="formsection">
            
                    <section class="bookingInput">
                        <label for="collectionName">Collection Name </label>
                        <input id="collectionName" name="collectionName" type="text" required="" >
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress1">Collection Address 1 </label>
                        <input id="collectionAddress1" name="collectionAddress1" type="text" required="" >
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress2">Collection Address 2 </label>
                        <input id="collectionAddress2" name="collectionAddress2" type="text" required="">
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress3">Collection Address 3 </label>
                        <input id="collectionAddress3" name="collectionAddress3" type="text" required="" >
                    </section>

                    <section class="bookingInput">
                        <label for="collectionPostcode">Collection Postcode</label>
                        <input id="collectionPostcode" name="collectionPostcode" type="text" required="">
                    </section>

                    <section class="bookingInput">
                        <label for="email">Collection Telephone Number</label>
                        <input id="collectionPhoneNumber" name="collectionPhoneNumber" type="text" minlength="11" maxlength="11" required="">
                    </section>
                    
                </section>
                <div>
                    <input id="updatebutton" class="updateButton" type="button" value="Update" aria-label="Update">
                    <div id="updateLoader" class="loader" style="display: none"></div>
                </div>
                
            </div>
            
        </div>
        <div class="profileinfobubble">
            <h2> Update Password</h2>
            <hr>
            <section class="formsection">
                <section class="bookingInput">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>
                </section>
                <section class="bookingInput">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" required>
                </section>
            </section>   

        <div>
        <div>
            <input id="updatePasswordButton" class="updateButton" type="button" value="Update Password" aria-label="Update">
            <div id="updatePasswordLoader" class="loader" style="display: none"></div>
        </div>
    </body>
</html>
