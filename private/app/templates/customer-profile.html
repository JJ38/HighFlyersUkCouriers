<!DOCTYPE html>
<html>
    <head> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" crossorigin href="./assets/CustomerProfile-CV6VsW0w.css">
      <link rel="stylesheet" crossorigin href="./assets/Navbar-BQ0c1Epq.css">
      <link rel="stylesheet" crossorigin href="./assets/MobileNavigationBar-BGA6MExJ.css">
    </head>
    
    <body>
        <header>
            <div id="mobilenavmenu"  class="hideMobileMenu">
                <div id="mobilenavwrapper">
                <div id="closemobilenavmenu"><p id="closenavtext">close</p><p>X</p></div>
                    <a href="/logout">Logout</a>
                    <a href="/customer-order">Order</a>
                    <a class="currentpage" href="/customer-profile">Profile</a>            
                </div>
            </div>
            <nav class="menu" contenteditable="false">
                <div id="mobilenavtoggle">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <a class="navLinks" href="/logout">Logout</a>
                <div>
                    <a class="navLinks" href="/customer-order">Order</a>
                    <div class="underlineOrder"></div>
                </div>
                <div>
                    <a class="navLinks" href="/customer-profile">Profile</a>
                    <div class="underlineProfile"></div>
                </div>
            </nav>
        </header>
        <div class="profileinfobubble">
            <form action="/customer-profile" method="post">
                <h2>Contact info</h2>
                    <hr>
                    <section class="formsection">
                        <section class="bookingInput">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" required="" value="{{email}}">
                        </section>
                    </section>    
                <h2>
                    Collection info
                </h2>
                <hr>
                <section class="formsection">
            
                    <section class="bookingInput">
                        <label for="collectionName">Collection Name </label>
                        <input id="collectionName" name="collectionName" type="text" required="" value="{{collection_name}}">
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress1">Collection Address 1 </label>
                        <input id="collectionAddress1" name="collectionAddress1" type="text" required="" value="{{collection_address_1}}">
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress2">Collection Address 2 </label>
                        <input id="collectionAddress2" name="collectionAddress2" type="text" required="" value="{{collection_address_2}}">
                    </section>

                    <section class="bookingInput">
                        <label for="collectionAddress3">Collection Address 3 </label>
                        <input id="collectionAddress3" name="collectionAddress3" type="text" required="" value="{{collection_address_3}}">
                    </section>

                    <section class="bookingInput">
                        <label for="collectionPostcode">Collection Postcode</label>
                        <input id="collectionPostcode" name="collectionPostcode" type="text" required="" value="{{collection_postcode}}">
                    </section>

                    <section class="bookingInput">
                        <label for="email">Collection Telephone Number</label>
                        <input id="collectionTelephone" name="collectionTelephone" type="text" minlength="11" maxlength="11" required="" value="{{collection_phone_number}}">
                    </section>
                 
                </section>
                <input id="updatebutton" type="submit" value="Update" aria-label="Update">
            </form>
        </div>
        <script type="text/javascript" src="/js/MobileNavigationBar.js"></script>
    </body>
</html>
